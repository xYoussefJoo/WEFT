services:
  db:
    image: postgres:17
    container_name: weft-db
    environment:
      POSTGRES_DB: weft
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weft -d weft"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
